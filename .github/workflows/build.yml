name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Force fix spec and build
        run: |
          pip install "Cython==0.29.36" buildozer
          sudo apt update && sudo apt install -y zip unzip libssl-dev libffi-dev python3-dev
          # Aquí forzamos el 33.0.2 aunque tu spec esté comentado
          sed -i 's/^#* *android.build_tools_version.*/android.build_tools_version = 33.0.2/' buildozer.spec
          sed -i 's/^#* *android.accept_sdk_license_agreements.*/android.accept_sdk_license_agreements = True/' buildozer.spec
          # Si no existían, las agregamos
          grep -q "build_tools_version" buildozer.spec || echo "android.build_tools_version = 33.0.2" >> buildozer.spec
          grep -q "accept_sdk_license" buildozer.spec || echo "android.accept_sdk_license_agreements = True" >> buildozer.spec
          cat buildozer.spec | grep -A2 -B2 "build_tools"
          rm -rf ~/.buildozer bin.buildozer
          buildozer android debug
      - uses: actions/upload-artifact@v4
        with:
          name: voladopillo-apk
          path: bin/*.apk
