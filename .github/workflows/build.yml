name: APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: kivy/buildozer
      options: --user root
    steps:
      - uses: actions/checkout@v4
      - run: buildozer android debug
      - uses: actions/upload-artifact@v4
        with:
          name: Voladopillo-APK
          path: bin/*.apk
