name: APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: digreatbrian/buildozer-action@v2
        with:
          python-version: python3.10
          buildozer-cmd: buildozer android debug
      - uses: actions/upload-artifact@v4
        with:
          name: APK-Voladopillo
          path: bin/*.apk
