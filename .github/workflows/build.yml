name: Build APK
on:
  push:
    branches: [ main ]
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install "Cython==0.29.36"
          pip install buildozer
          sudo apt update
          sudo apt install -y openjdk-17-jdk zip unzip
      - name: Build APK
        run: |
          mkdir -p ~/.android/licenses
          echo "8933bad161af4178b1185d1a37fbf41ea5269c55" > ~/.android/licenses/android-sdk-license
          echo "d56f5187479451eabf01fb78af6dfcb131a6481e" >> ~/.android/licenses/android-sdk-license
          echo "24333f8a63b6825ea9c5514f83c1059b8ea731e" >> ~/.android/licenses/android-sdk-license
          buildozer android debug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: voladopillo-apk
          path: bin/*.apk
